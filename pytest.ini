; Pytest configuration for geo-prewarp.
; Created 2026-07-30 for the heatr3d S1 gate (there was no prior pytest config:
; no pytest.ini / setup.cfg / tox.ini / pyproject.toml anywhere in the repo).
;
; Deliberately minimal: it registers the `slow` marker and deselects it by
; default. It sets NO testpaths, NO --ignore and NO collection filters, so the
; set of files collected by a bare `pytest` is exactly what it was before --
; including the 25 pre-existing `fixture 'run_dir' not found` collection errors
; in test_heatr3d_outputs.py / test_fgm_pipeline.py (documented in
; docs/superpowers/plans/s1-findings.md section 12; out of S1 scope, and they
; must stay visible rather than be hidden by this config).
[pytest]
markers =
    slow: full-scale heatr3d runs (minutes+); excluded from default runs
addopts = -m "not slow"
